[package]
name = "ace"
version = "0.9.2"
edition = "2024"
description = "Accelerated Coding Environment — setup and manage AI coding assistants"
repository = "https://github.com/ace-rs/ace"
homepage = "https://ace-rs.dev"
license = "MIT"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
console = "0.16.4"
ctrlc = "3"
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }
inquire = { version = "0.9.4", default-features = false, features = ["console", "one-liners"] }
once_cell = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "1.1.5"
serde_json = "1.0.151"
ureq = { version = "3.4.0", default-features = false, features = [
  "json",
  "rustls"
] }
semver = "1"
toml_edit = { version = "0.25.13", default-features = false, features = ["parse", "display"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.test]
debug = "line-tables-only"
